[build-system]
requires = ['setuptools==68.2.2', 'wheel', 'Cython>=3.2.9', 'h5py>=3.15.0', 'numpy>=2.0.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'pykonal'
version = '0.5.6'
authors = [
    {name='Malcolm C. A. White'}
]
description = 'Solve the Eikonal equation in 3D Cartesian or spherical coordinates.'
readme = 'README.md'
requires-python = '>= 3.11'
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Physics'
]

[project.urls]
'Homepage' = 'https://github.com/malcolmw/pykonal'
'Bug Tracker' = 'https://github.com/malcolmw/pykonal/issues'
